[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-ia-edu-core"
version = "0.1.0"
description = "Infraestrutura de inteligência educacional para aquisição, organização e busca de questões."
requires-python = ">=3.13,<3.14"
dependencies = [
	"SQLAlchemy>=2.0,<3.0",
	"psycopg[binary]>=3.2,<4.0",
	"fastapi>=0.115,<1.0",
	"uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
	"alembic>=1.13,<2.0",
	"httpx2>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

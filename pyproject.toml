[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-ia-edu-core"
version = "0.1.0"
description = "Infraestrutura de inteligência educacional para aquisição, organização e busca de questões."
requires-python = ">=3.13,<3.14"
dependencies = [
	"SQLAlchemy>=2.0,<3.0",
	"greenlet>=3.0,<4.0",
	"psycopg[binary]>=3.2,<4.0",
	"fastapi>=0.115,<1.0",
	"uvicorn[standard]>=0.30,<1.0",
	"openai>=1.0,<2.0",
	"pypdf>=5.0,<6.0",
	"python-multipart>=0.0.9,<1.0",
	"PyYAML>=6.0,<7.0",
	"PyJWT>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
	"alembic>=1.13,<2.0",
	"httpx2>=2.0.0",
]
# Optional PDF text-recovery backend (PHASE 10.6). Used only by
# agente_ia_edu.services.text_recovery to rescue booklets whose embedded text
# layer pypdf cannot decode (e.g. ENEM 2021 subsetted fonts with no ToUnicode
# CMap). The module degrades to recovery_status="RECOVERY_PENDING" when absent.
# NOT wired into the ingestion pipeline. Do NOT add pdfplumber here: it pulls in
# Pillow, which changes pypdf's page.images behaviour and breaks the parser.
recovery = [
	"pymupdf>=1.24,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agente_ia_edu.rubrics" = ["*.yaml"]

[tool.pytest.ini_options]
# The editable install pins src/ in the primary checkout, so a worktree would
# silently import and test the WRONG tree. This puts the checkout's own src/ at
# the front of sys.path for every pytest run, whichever checkout it runs in.
#
# "." is also required: two test files import `tools.extract_cartilha_enem`,
# which only resolves when the working directory is on sys.path. `python -m
# pytest` adds it for free, but the bare `pytest` console script does not -
# without "." here it aborts collection of the entire suite, not just those
# two files.
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
# Without this, coverage silently under-reports every route/service that goes
# through SQLAlchemy's async engine (bridged onto sync DBAPI drivers via
# greenlet) or through Starlette's TestClient (which runs each request in a
# background thread via anyio's blocking portal). Line ranges inside
# "async with session_factory() as session:" blocks, and anything executed
# during a TestClient request, were showing up as 0% covered even when tests
# clearly exercised them (asserting on their behavior) - `coverage report`
# was just blind to those frames. See routes/attempts.py and
# routes/learning_path.py coverage before/after this change for the effect.
concurrency = ["thread", "greenlet"]

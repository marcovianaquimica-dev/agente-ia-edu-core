name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (SQLite suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package + test dependencies
        run: python -m pip install -e ".[dev,recovery]"

      # Two families of test excluded here, neither fixable by CI config -
      # confirmed by actually running the full suite against a genuinely
      # fresh checkout (no .env, no var/, no ambient Postgres) before this
      # workflow was written:
      #
      # 1. Real INEP exam corpus (var/inep-pilot/*.pdf) - gitignored on
      #    purpose (real proprietary exam booklets, several MB each), so it
      #    only exists on a machine that fetched it out-of-band. These are
      #    already documented "local only" in their own docstrings.
      # 2. Direct `TestClient(app)` hits with no injected session - these
      #    need a real, reachable, already-migrated Postgres via
      #    DATABASE_URL (the shared dev database these tests were written
      #    against), which no GitHub-hosted runner has. Every other test in
      #    the suite builds its own in-memory SQLite session instead.
      #
      # Neither is a bug introduced by this PR - both predate it and only
      # ever ran on a developer's machine with the extra local setup
      # already in place. Postgres-backed *migration* tests are NOT in this
      # list: each of those creates and tears down its own throwaway
      # database and already skips gracefully (unittest.SkipTest) when no
      # Postgres is reachable at all, which is exactly this runner's case.
      - name: Run test suite
        run: >
          python -m pytest tests -q
          --ignore=tests/test_controlled_retrieval_vocabulary.py
          --ignore=tests/test_curriculum_retriever_benchmark.py
          --ignore=tests/test_phase9g_coverage.py
          --ignore=tests/test_phase9k_retrieval_diagnostics.py
          --ignore=tests/test_phase9m_expanded_benchmark.py
          --ignore=tests/test_phase9q_coverage_matrix.py
          --ignore=tests/test_phase9t2_controlled_vocabulary.py
          --ignore=tests/test_phase9u2h4_review_packet.py
          --ignore=tests/test_api_questions.py
          --ignore=tests/test_get_current_identity_error_handling.py
          --ignore=tests/test_question_bank_advanced_search.py
          --ignore=tests/test_student_study_search.py
